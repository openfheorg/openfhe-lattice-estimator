services:
  estimator:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # A tag, branch name, or FULL commit SHA -- `git fetch` rejects an
        # abbreviated one ("couldn't find remote ref").
        #
        # THIS PIN IS DUPLICATED: here and in Dockerfile's ARG OPENFHE_REF. The
        # Dockerfile default only applies to a plain `docker build`; compose
        # always passes its own, so bumping only the Dockerfile silently rebuilds
        # the OLD ref under the NEW tag. Move both together. (The `image:` line
        # below is a third use of the same value, which is what makes the tag
        # track the ref.)
        OPENFHE_REF: ${OPENFHE_REF:-128582771b50ce798bfa36d63e43b550b1b17ea0}
        # OpenFHE's heavier translation units peak near 2 GB each. 4 jobs suits
        # a laptop or a memory-capped Docker Desktop VM; raise it on a big box.
        MAKE_JOBS: ${MAKE_JOBS:-4}
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
        # clang-18 measured ~2x faster than gcc for BinFHE gates. NATIVEOPT=ON
        # bakes in -march=native: fast, but the image then requires a CPU at
        # least as capable as the build machine. Export WITH_NATIVEOPT=OFF for
        # an image you intend to move between machines.
        CC_BIN: ${CC_BIN:-clang-18}
        CXX_BIN: ${CXX_BIN:-clang++-18}
        WITH_NATIVEOPT: ${WITH_NATIVEOPT:-ON}
    image: openfhe-lattice-estimator:${OPENFHE_REF:-128582771b50ce798bfa36d63e43b550b1b17ea0}

    init: true
    stdin_open: true
    tty: true

    # No memory limit by default, so the container may use all host RAM. The
    # measurement fan-out reads MemAvailable and honours a cgroup limit, so
    # setting one here (mem_limit: 32g) is respected rather than fought.
    # mem_limit: 32g

    # Safety net. sage.all retries its interface subprocesses without bound if
    # it is ever started without Sage's environment, which can otherwise take a
    # whole machine down. Generous for real work, fatal to a runaway.
    pids_limit: 4096

    environment:
      # Set to 1 for single-core KeyGen/EvalBinGate timings; see
      # docs/measurement-practice.md.
      # Listed without a value so it is forwarded only when actually set on the
      # host. Assigning it an empty string instead makes libgomp print a warning
      # on stderr -- the same stream the scripts read noise values from, which
      # then dies in float('') far from the cause.
      - OMP_NUM_THREADS

      # The measurement arms' knobs, so that
      #   METHODS=LMKCDEY est estimator bash scripts/dse-arms/recalibrate.sh
      # works from a host shell. Compose forwards nothing it is not told to, and
      # a knob that does not arrive is worse than one that errors: the run
      # measures the default and every line of its log looks right. Same rule as
      # above -- no value, so each is forwarded only when actually set.
      - METHODS          # which bootstrapping methods to measure
      - STAGES           # which recalibrate.sh stages to run
      - MT_THREADS       # thread count for the many-thread regime
      - THREADS          # thread count for one gatecost-regime.sh invocation
      - NS               # ring dimensions to sweep
      - WORDS            # 32, 64, or both
      - MAPS             # add two-base gadget maps to a sweep
      - MAPS_ONLY        # measure only those
      - PIN              # 0 to run unpinned
      - PIN_CPUS         # a taskset -c list, chosen for you when unset
      - DRY              # 1 to print the plan and measure nothing
      - KEYS             # keys per row for the noise arms
      - SAMPLES          # gates per key
      - AP_KEY_GIB_MAX   # refuse an AP row whose refresh key exceeds this

    command: ["bash"]
